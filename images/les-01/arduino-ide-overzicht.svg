<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img"><rect width="1200" height="680" rx="22" fill="#f4f7fb"/><rect x="40" y="35" width="1120" height="600" rx="16" fill="white" stroke="#dce5f1" stroke-width="3"/><text x="68" y="90" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" fill="#1b2a40">Arduino IDE 2 – overzicht</text><rect x="70" y="125" width="240" height="64" rx="12" fill="#eaf4ff" stroke="#dce5f1"/><text x="85" y="165" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#1b2a40">1. Verify</text><rect x="345" y="125" width="240" height="64" rx="12" fill="#eaf4ff" stroke="#dce5f1"/><text x="360" y="165" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#1b2a40">2. Upload</text><rect x="620" y="125" width="240" height="64" rx="12" fill="#eaf4ff" stroke="#dce5f1"/><text x="635" y="165" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#1b2a40">3. Board/Port</text><rect x="895" y="125" width="240" height="64" rx="12" fill="#eaf4ff" stroke="#dce5f1"/><text x="910" y="165" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#1b2a40">4. Serial Monitor</text><rect x="70" y="215" width="1060" height="375" rx="12" fill="#172438"/><text x="115" y="265" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eaf2ff">void setup() {</text><text x="115" y="304" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eaf2ff">  Serial.begin(115200);</text><text x="115" y="343" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eaf2ff">}</text><text x="115" y="382" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eaf2ff"></text><text x="115" y="421" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eaf2ff">void loop() {</text><text x="115" y="460" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eaf2ff">  Serial.println(&quot;Hallo, ik ben een ESP32!&quot;);</text><text x="115" y="499" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eaf2ff">  delay(1000);</text><text x="115" y="538" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eaf2ff">}</text><text x="70" y="620" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#64748b">Vereenvoudigd overzicht. De echte interface kan per versie verschillen.</text></svg>