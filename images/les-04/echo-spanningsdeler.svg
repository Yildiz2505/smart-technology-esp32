<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><rect width="1100" height="560" rx="22" fill="#f4f7fb"/><text x="44" y="62" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#1b2a40" font-weight="bold">De ECHO-spanningsdeler</text><text x="44" y="108" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#9c4c25" >De 5V-uitgang van de sensor mag niet rechtstreeks op GPIO19.</text><rect x="55" y="190" width="225" height="150" rx="16" fill="#2577a6"/><text x="96" y="245" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="white" font-weight="bold">HC-SR04</text><text x="85" y="298" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="white" >ECHO (5 V)</text><path d="M280 273 H405" stroke="#dd8c22" stroke-width="8"/><rect x="405" y="252" width="175" height="44" rx="8" fill="#e1c18b" stroke="#a97f43" stroke-width="4"/><text x="448" y="283" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#1b2a40" >2,2 kΩ</text><path d="M580 273 H747" stroke="#dd8c22" stroke-width="8"/><circle cx="747" cy="273" r="12" fill="#dd8c22"/><path d="M747 273 H910" stroke="#2e8d88" stroke-width="8"/><rect x="910" y="235" width="145" height="78" rx="12" fill="#172438"/><text x="935" y="282" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="white" font-weight="bold">GPIO19</text><path d="M747 273 V357" stroke="#3579b5" stroke-width="8"/><rect x="726" y="357" width="43" height="94" rx="6" fill="#e1c18b" stroke="#a97f43" stroke-width="4"/><path d="M747 451 V485 H875" stroke="#3579b5" stroke-width="8"/><rect x="875" y="451" width="177" height="69" rx="10" fill="#eaf4ff" stroke="#3579b5" stroke-width="3"/><text x="936" y="494" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#1b2a40" font-weight="bold">GND</text><text x="784" y="414" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#1b2a40" >3,3 kΩ</text><text x="612" y="210" font-family="Arial,Helvetica,sans-s